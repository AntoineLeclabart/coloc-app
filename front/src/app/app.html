@if (!enConnexion()) {
  <header class="barre">
    <span class="logo">Coloc</span>
    @if (avecMois()) {
      <div class="mois">
        <button type="button" class="icone" (click)="mois.decaler(-1)" aria-label="Mois précédent">‹</button>
        <span>{{ mois.libelle() }}</span>
        <button type="button" class="icone" (click)="mois.decaler(1)" aria-label="Mois suivant">›</button>
      </div>
    }
    <button type="button" class="icone deconnexion" (click)="deconnexion()" aria-label="Se déconnecter" title="Se déconnecter">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" /></svg>
    </button>
  </header>

  <nav class="onglets" aria-label="Navigation principale">
    <a routerLink="/bilan" routerLinkActive="actif">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18M7 15l4-4 3 3 6-6" /></svg>
      Bilan
    </a>
    <a routerLink="/depenses" routerLinkActive="actif">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2zM9 7h6M9 11h6M9 15h4" /></svg>
      Dépenses
    </a>
    <a routerLink="/absences" routerLinkActive="actif">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v16H4zM4 10h16M8 3v4M16 3v4" /></svg>
      Absences
    </a>
    <a routerLink="/reglages" routerLinkActive="actif">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0M14 4v4M8 10v4M16 16v4" /></svg>
      Réglages
    </a>
  </nav>
}
<main [class.avec-onglets]="!enConnexion()">
  <router-outlet />
</main>
