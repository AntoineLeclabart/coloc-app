# Environnement de développement : `docker compose up`, puis http://localhost:4200
services:
  api:
    # Image Debian (pas Alpine) : le moteur workerd de Cloudflare a besoin de glibc.
    image: node:24
    working_dir: /app/api
    command: sh -c "npm ci && npm run dev"
    volumes:
      - ./api:/app/api
      - ./front/dist:/app/front/dist
      - api_node_modules:/app/api/node_modules
    ports:
      - "8000:8000"

  front:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npx ng serve --host 0.0.0.0"
    environment:
      API_URL: http://api:8000
    volumes:
      - ./front:/app
      - front_node_modules:/app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      - api

volumes:
  api_node_modules:
  front_node_modules:
